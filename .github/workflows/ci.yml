name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & assemble AAR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17        # AGP 8.13.2 requires JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release version
        run: ./gradlew :simula-ad-sdk:verifyVersionConsistency

      - name: Compile (fail fast)
        run: ./gradlew :simula-ad-sdk:compileDebugKotlin

      - name: Run all unit tests
        run: ./gradlew :simula-ad-sdk:testDebugUnitTest :simula-ad-sdk:testReleaseUnitTest

      - name: Build release AAR
        run: ./gradlew :simula-ad-sdk:assembleRelease

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-sdk-aar-${{ github.sha }}
          path: simula-ad-sdk/build/outputs/aar/*.aar
          if-no-files-found: error
