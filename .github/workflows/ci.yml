name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & assemble AAR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17        # AGP 8.13.2 requires JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release version
        run: ./gradlew :simula-ad-sdk:verifyVersionConsistency

      - name: Compile (fail fast)
        run: ./gradlew :simula-ad-sdk:compileDebugKotlin

      - name: Run all unit tests
        run: ./gradlew :simula-ad-sdk:testDebugUnitTest :simula-ad-sdk:testReleaseUnitTest

      - name: Build release AAR
        run: ./gradlew :simula-ad-sdk:assembleRelease

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-sdk-aar-${{ github.sha }}
          path: simula-ad-sdk/build/outputs/aar/*.aar
          if-no-files-found: error

  instrumented-test:
    name: SQLite instrumented test (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: ./gradlew :simula-ad-sdk:connectedDebugAndroidTest
