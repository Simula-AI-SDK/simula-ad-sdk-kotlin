name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match sdkVersion, without a leading v)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Maven
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate source and version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Releases must be dispatched from main"
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]] || {
            echo "::error::Version must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-dev.NUMBER, without a leading v"
            exit 1
          }
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "::error::Release checkout is not the current origin/main commit"
            exit 1
          }
          SUCCESSFUL_RUNS=$(gh run list \
            --workflow CI \
            --commit "$GITHUB_SHA" \
            --json conclusion \
            --jq 'map(select(.conclusion == "success")) | length')
          [[ "$SUCCESSFUL_RUNS" -gt 0 ]] || {
            echo "::error::Release commit must have a successful CI run"
            exit 1
          }
          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Git tag v$VERSION already exists"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub release v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version sync
        run: |
          ./gradlew :simula-ad-sdk:verifyVersionConsistency
          grep -Fq "val sdkVersion = \"${{ steps.version.outputs.version }}\"" \
            simula-ad-sdk/build.gradle.kts || {
              echo "::error::Release version does not match sdkVersion"
              exit 1
            }

      - name: Reject an existing Maven Central version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://repo1.maven.org/maven2/ad/simula/ad-sdk/$VERSION/ad-sdk-$VERSION.pom"
          if curl --fail --silent --show-error --head "$URL" >/dev/null; then
            echo "::error::ad.simula:ad-sdk:$VERSION already exists on Maven Central"
            exit 1
          fi

      - name: Validate publishing secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_KEY_ID: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED_SECRETS=(
            MAVEN_CENTRAL_USERNAME
            MAVEN_CENTRAL_PASSWORD
            MAVEN_SIGNING_KEY
            MAVEN_SIGNING_KEY_ID
            MAVEN_SIGNING_PASSWORD
          )
          MISSING_SECRETS=()
          for NAME in "${REQUIRED_SECRETS[@]}"; do
            [[ -n "${!NAME:-}" ]] || MISSING_SECRETS+=("$NAME")
          done
          if (( ${#MISSING_SECRETS[@]} > 0 )); then
            echo "::error::Missing secrets in the Maven environment: ${MISSING_SECRETS[*]}"
            exit 1
          fi
          if [[ "$MAVEN_SIGNING_KEY" != *"-----BEGIN PGP PRIVATE KEY BLOCK-----"* ]]; then
            echo "::error::MAVEN_SIGNING_KEY must contain an ASCII-armored PGP private key"
            exit 1
          fi

      - name: Build and test release
        run: |
          ./gradlew clean \
            :simula-ad-sdk:compileDebugKotlin \
            :simula-ad-sdk:testDebugUnitTest \
            :simula-ad-sdk:testReleaseUnitTest \
            :simula-ad-sdk:assembleRelease

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: release-aar-${{ github.sha }}
          path: simula-ad-sdk/build/outputs/aar/simula-ad-sdk-release.aar
          if-no-files-found: error

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew :simula-ad-sdk:publishAndReleaseToMavenCentral --no-configuration-cache

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download release AAR
        uses: actions/download-artifact@v4
        with:
          name: release-aar-${{ github.sha }}
          path: release-artifact

      - name: Create tag, release, and upload AAR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "refs/tags/$TAG"
          RELEASE_TYPE=()
          if [[ "$VERSION" == *-dev.* ]]; then
            RELEASE_TYPE=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "$TAG" \
            "${RELEASE_TYPE[@]}" \
            "release-artifact/simula-ad-sdk-release.aar#ad-sdk-$VERSION.aar"
